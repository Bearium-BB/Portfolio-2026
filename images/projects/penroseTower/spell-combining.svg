<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="Oxanium, Segoe UI, sans-serif" role="img" aria-label="Spell combining diagram: two element presses fill two slots, and the pair of slots picks one of four spells">
  <rect width="1280" height="560" fill="#050508"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4779A5"/>
    </marker>
  </defs>

  <text x="640" y="56" text-anchor="middle" fill="#8CCBFF" font-size="40" font-weight="700">Spell Combining</text>
  <text x="640" y="90" text-anchor="middle" fill="#71849B" font-size="20">Two elements, two slots, four spells. Order matters.</text>

  <!-- Column headings -->
  <text x="180" y="150" text-anchor="middle" fill="#63D6D0" font-size="20" font-weight="700">1. PRESS AN ELEMENT</text>
  <text x="505" y="150" text-anchor="middle" fill="#63D6D0" font-size="20" font-weight="700">2. TWO SLOTS</text>
  <text x="960" y="150" text-anchor="middle" fill="#63D6D0" font-size="20" font-weight="700">3. PRESS CAST: RECIPE LOOKUP</text>

  <!-- Element inputs -->
  <rect x="60" y="180" width="240" height="90" rx="10" fill="#172B40" stroke="#4779A5" stroke-width="2"/>
  <circle cx="110" cy="225" r="18" fill="#FF8A5B"/>
  <text x="145" y="215" fill="#FFFFFF" font-size="26" font-weight="700">Fire</text>
  <text x="145" y="245" fill="#A9D5FF" font-size="18">element key</text>

  <rect x="60" y="300" width="240" height="90" rx="10" fill="#172B40" stroke="#4779A5" stroke-width="2"/>
  <circle cx="110" cy="345" r="18" fill="#55A6FF"/>
  <text x="145" y="335" fill="#FFFFFF" font-size="26" font-weight="700">Water</text>
  <text x="145" y="365" fill="#A9D5FF" font-size="18">element key</text>

  <!-- Arrows into the slots -->
  <line x1="302" y1="225" x2="380" y2="240" stroke="#4779A5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="302" y1="345" x2="380" y2="270" stroke="#4779A5" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Slots (example: Water in slot 1, Fire in slot 2) -->
  <rect x="385" y="190" width="110" height="130" rx="10" fill="#101020" stroke="#63D6D0" stroke-width="2"/>
  <text x="440" y="218" text-anchor="middle" fill="#71849B" font-size="18">Slot 1</text>
  <circle cx="440" cy="255" r="22" fill="#55A6FF"/>
  <text x="440" y="305" text-anchor="middle" fill="#FFFFFF" font-size="20">Water</text>

  <rect x="515" y="190" width="110" height="130" rx="10" fill="#101020" stroke="#63D6D0" stroke-width="2"/>
  <text x="570" y="218" text-anchor="middle" fill="#71849B" font-size="18">Slot 2</text>
  <circle cx="570" cy="255" r="22" fill="#FF8A5B"/>
  <text x="570" y="305" text-anchor="middle" fill="#FFFFFF" font-size="20">Fire</text>

  <!-- Pointer -->
  <path d="M440 336 L428 356 L452 356 Z" fill="#63D6D0"/>
  <text x="505" y="388" text-anchor="middle" fill="#63D6D0" font-size="18">arrow = slot the next press replaces</text>

  <!-- Arrow to recipes -->
  <line x1="630" y1="255" x2="695" y2="255" stroke="#4779A5" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Recipe rows -->
  <g>
    <rect x="700" y="170" width="520" height="76" rx="10" fill="#172B40" stroke="#4779A5" stroke-width="2"/>
    <circle cx="730" cy="208" r="12" fill="#55A6FF"/><text x="752" y="215" fill="#C5D0DF" font-size="22">Water</text>
    <text x="835" y="215" fill="#71849B" font-size="22">+</text>
    <circle cx="875" cy="208" r="12" fill="#FF8A5B"/><text x="897" y="215" fill="#C5D0DF" font-size="22">Fire</text>
    <text x="965" y="215" fill="#4779A5" font-size="24">&#8594;</text>
    <text x="1005" y="215" fill="#FFFFFF" font-size="24" font-weight="700">Steam Cloud</text>
  </g>
  <g>
    <rect x="700" y="260" width="520" height="76" rx="10" fill="#172B40" stroke="#4779A5" stroke-width="2"/>
    <circle cx="730" cy="298" r="12" fill="#FF8A5B"/><text x="752" y="305" fill="#C5D0DF" font-size="22">Fire</text>
    <text x="835" y="305" fill="#71849B" font-size="22">+</text>
    <circle cx="875" cy="298" r="12" fill="#55A6FF"/><text x="897" y="305" fill="#C5D0DF" font-size="22">Water</text>
    <text x="985" y="305" fill="#4779A5" font-size="24">&#8594;</text>
    <text x="1020" y="305" fill="#FFFFFF" font-size="24" font-weight="700">Frost Burst</text>
  </g>
  <g>
    <rect x="700" y="350" width="520" height="76" rx="10" fill="#172B40" stroke="#4779A5" stroke-width="2"/>
    <circle cx="730" cy="388" r="12" fill="#FF8A5B"/><text x="752" y="395" fill="#C5D0DF" font-size="22">Fire</text>
    <text x="835" y="395" fill="#71849B" font-size="22">+</text>
    <circle cx="875" cy="388" r="12" fill="#FF8A5B"/><text x="897" y="395" fill="#C5D0DF" font-size="22">Fire</text>
    <text x="965" y="395" fill="#4779A5" font-size="24">&#8594;</text>
    <text x="1005" y="395" fill="#FFFFFF" font-size="24" font-weight="700">Flame Torrent</text>
  </g>
  <g>
    <rect x="700" y="440" width="520" height="76" rx="10" fill="#172B40" stroke="#4779A5" stroke-width="2"/>
    <circle cx="730" cy="478" r="12" fill="#55A6FF"/><text x="752" y="485" fill="#C5D0DF" font-size="22">Water</text>
    <text x="835" y="485" fill="#71849B" font-size="22">+</text>
    <circle cx="875" cy="478" r="12" fill="#55A6FF"/><text x="897" y="485" fill="#C5D0DF" font-size="22">Water</text>
    <text x="985" y="485" fill="#4779A5" font-size="24">&#8594;</text>
    <text x="1020" y="485" fill="#FFFFFF" font-size="24" font-weight="700">Lightning Bolt</text>
  </g>

</svg>
